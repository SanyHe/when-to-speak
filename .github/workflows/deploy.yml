name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dev dependencies
        run: python -m pip install jsonschema pytest
      - name: Run harness verification
        run: python -m pytest training/tests/ -q
      - name: Regenerate traces and check they match the committed ones
        run: |
          python training/src/evaluate.py \
            --eval data/synthetic/eval_set.jsonl \
            --models base,sft,sft_grpo \
            --out /tmp/eval_report.json \
            --web-out /tmp/traces.json
          python - <<'PY'
          import json
          committed = json.load(open("web/data/traces.json"))
          fresh = json.load(open("/tmp/traces.json"))
          assert committed["events"] == fresh["events"], "traces.json is stale; rebuild it"
          assert committed["metrics"] == fresh["metrics"], "metrics are stale; rebuild them"
          print("traces.json is up to date")
          PY
      - name: Verify web metric formulas match the eval report
        run: node training/tests/verify_web_metrics.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
